<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>PORTABOOM QR editor</title>
<style>
:root{--navy:#1B2A4A;--orange:#EE7202;--cream:#f4efe6}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#e9e4da;color:var(--navy);font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
#app{display:flex;height:100%;gap:0}
#left{flex:1 1 auto;display:flex;flex-direction:column;align-items:center;min-width:0;padding:12px}
#phone{position:relative;flex:1 1 auto;width:100%;display:flex;align-items:center;justify-content:center;min-height:0}
#frameWrap{position:relative;width:390px;height:844px;transform-origin:center center;border-radius:28px;overflow:hidden;box-shadow:0 10px 30px rgba(27,42,74,.25);background:var(--cream)}
#preview{width:390px;height:844px;border:0;display:block}
#bar{width:100%;max-width:760px;margin-top:10px}
#row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
button,select{font:inherit;border:0;border-radius:999px;padding:8px 14px;background:var(--navy);color:#fff;cursor:pointer}
button.alt{background:#fff;color:var(--navy);box-shadow:inset 0 0 0 1.5px var(--navy)}
button.go{background:var(--orange)}
#time{font-variant-numeric:tabular-nums;min-width:120px}
#scrub{width:100%;margin:8px 0 2px}
#marks{position:relative;height:42px;width:100%}
#marks button{position:absolute;transform:translateX(-50%);padding:2px 7px;font-size:11px;border-radius:6px;background:#fff;color:var(--navy);box-shadow:inset 0 0 0 1px #9aa6bb;white-space:nowrap}
#marks button.lo{top:20px}
#status{font-size:12px;color:#4a5874;margin-top:4px;min-height:1.4em}
#right{flex:0 0 360px;overflow:auto;background:#1f1f1f}
#right .lil-gui.root{width:100% !important;--width:100%}
@media (max-width:900px){#app{flex-direction:column;height:auto}#right{flex:none;width:100%}#phone{height:70vh}}
</style>
</head>
<body>
<div id="app">
  <div id="left">
    <div id="phone"><div id="frameWrap"><iframe id="preview" title="Live preview"></iframe></div></div>
    <div id="bar">
      <div id="row">
        <select id="mode" aria-label="Version"><option value="morph3">morph3</option><option value="road">road</option><option value="minions">minions</option><option value="minions2">minions2</option><option value="domino">domino</option><option value="domino2">domino2</option><option value="night">night</option><option value="drone">drone</option><option value="blueprint">blueprint</option><option value="rain">rain</option></select>
        <button id="play" class="go" type="button">Pause</button>
        <button id="replay" type="button">Replay</button>
        <span id="time">0.00 s</span>
        <button id="reset" class="alt" type="button">Reset</button>
        <button id="copy" class="alt" type="button">Copy JSON</button>
        <button id="download" class="alt" type="button">Download</button>
        <button id="apply" class="alt" type="button" title="Use these settings when this browser opens the page">Use in this browser</button>
        <button id="clear" class="alt" type="button" title="Forget the settings saved in this browser">Clear browser</button>
      </div>
      <input id="scrub" type="range" min="0" max="20" step="0.05" value="0" aria-label="Timeline">
      <div id="marks"></div>
      <div id="status"></div>
    </div>
  </div>
  <div id="right"></div>
</div>
<script type="module">
import GUI from "./vendor/lil-gui/lil-gui.esm.min.js";

const EDIT_KEY = "portaboom.editor.config";
const LIVE_KEY = "portaboom.config";
const $ = (id) => document.getElementById(id);
const status = (t) => { $("status").textContent = t; };

const fileCfg = await fetch("./morph-config.json", { cache: "no-cache" }).then((r) => r.json());
let cfg = structuredClone(fileCfg);
try {
  const saved = JSON.parse(localStorage.getItem(EDIT_KEY) || "null");
  if (saved) cfg = merge(cfg, saved);
} catch (e) { /* ignore a broken saved copy */ }

function merge(a, b) {
  const out = structuredClone(a);
  for (const [k, v] of Object.entries(b || {})) {
    if (v && typeof v === "object" && !Array.isArray(v) && typeof out[k] === "object") out[k] = merge(out[k], v);
    else if (k in out) out[k] = v;
  }
  return out;
}

/* ---------- timeline ---------- */
function steps() {
  const scan = cfg.scan.duration_s;
  const fill = cfg.fill.duration_s;
  const m0 = scan + fill;
  // domino: the hero's flight, resolve and glide all start domino.delay_s later.
  const dm = ($("mode").value === "domino" || $("mode").value === "domino2") && cfg.domino ? ($("mode").value === "domino2" ? { ...cfg.domino, ...(cfg.domino2 || {}) } : cfg.domino) : null;
  // drone: the same delay, and the glide is replaced by the drone's swoop down to the road.
  const dr = $("mode").value === "drone" && cfg.drone ? cfg.drone : null;
  const dl = dm ? dm.delay_s : dr ? dr.delay_s : 0;
  const end = Math.max(cfg.resolve.start_s + cfg.resolve.duration_s + 0.2, cfg.morph_end_s) + dl;
  const glideAt = dr ? dr.swoop_start_s : cfg.camera.glide_start_s + dl, glideS = dr ? dr.swoop_s : cfg.camera.glide_s;
  const show = m0 + Math.max(end, glideAt + glideS + cfg.camera.glide_hold_s);
  const rd = ($("mode").value === "road" || dr) && cfg.road ? cfg.road : null;
  const g = rd ? rd.green_s : cfg.lights.green_s, a = rd ? rd.amber_s : cfg.lights.amber_s, r = rd ? rd.red_hold_s : cfg.lights.red_hold_s, l = cfg.boom.lower_s;
  const leave = rd ? rd.leave_after_s : cfg.boom.leave_after_s;
  const pre = rd ? l + (rd.boom_down_wait_s ?? 0.6) + l : 0;
  const marks = [
    ["Scan", 0], ["QR fills", scan], ["Lift", m0 + cfg.lift.start_s + dl], ["Flight", m0 + 0.9 + dl], ["Assembly", m0 + 2.2 + dl],
    ["Resolve", m0 + cfg.resolve.start_s + dl], ["Glide", m0 + glideAt], ["Green", show + pre], ["Amber", show + pre + g],
    ["Red", show + pre + g + a], ["Boom down", show + pre + g + a + r], ["DEST", show + pre + g + a + r + l + leave],
  ];
  if (rd && !dr) marks.splice(6, 0, ["Road builds", m0 + rd.build_start_s]);
  if ($("mode").value === "minions" && cfg.minions) marks.push(["Minis pop", m0 + cfg.minions.pop_start_s], ["Line up", m0 + cfg.minions.line_up_s]);
  if ($("mode").value === "minions2" && cfg.minions) { const mm = { ...cfg.minions, ...(cfg.minions2 || {}) }; marks.push(["Minis pop", m0 + mm.pop_start_s], ["Crowd follows", m0 + mm.line_up_s]); }
  if (dm) {
    marks.splice(marks.findIndex((x) => x[0] === "Lift"), 1);
    marks.push(["Dominoes fall", m0 + dm.topple_start_s], ["Down to the aisle", m0 + dm.swoop_start_s], ["Down the aisle", m0 + dm.swoop_start_s + dm.swoop_s]);
  }
  if (dr) {
    marks.splice(marks.findIndex((x) => x[0] === "Lift"), 1);
    marks.splice(marks.findIndex((x) => x[0] === "Glide"), 1);
    marks.push(["Drone up", m0 + dr.pull_start_s], ["QR to worksite", m0 + dr.transform_start_s], ["Swoop down", m0 + dr.swoop_start_s]);
  }
  if (rd) marks.push(["Boom lowers", show], ["Boom rises", show + l + (rd.boom_down_wait_s ?? 0.6)]);
  return marks.sort((x, y) => x[1] - y[1]);
}
function drawMarks() {
  const st = steps();
  const total = st[st.length - 1][1] + 0.5;
  $("scrub").max = total.toFixed(2);
  const box = $("marks");
  box.innerHTML = "";
  st.forEach(([name, t], i) => {
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = name;
    b.className = i % 2 ? "lo" : "";
    b.style.left = `${(t / total) * 100}%`;
    b.onclick = () => seek(t + 0.05, true);
    box.appendChild(b);
  });
}

/* ---------- preview ---------- */
let playing = true;
let curT = 0;
let reloadTimer = 0;
function load(t = 0, paused = false) {
  localStorage.setItem(EDIT_KEY, JSON.stringify(cfg));
  const u = new URL("./", location.href);
  u.searchParams.set("v", $("mode").value);
  u.searchParams.set("editor", "1");
  u.searchParams.set("autoplay", "1");
  if (t > 0) u.searchParams.set("seek", t.toFixed(2));
  if (paused) u.searchParams.set("paused", "1");
  u.searchParams.set("r", String(Date.now()));
  $("preview").src = u.href;
  playing = !paused;
  $("play").textContent = playing ? "Pause" : "Play";
  status(t > 0 ? `Loading, then jumping to ${t.toFixed(2)} s ...` : "Loading ...");
}
function seek(t, paused) { curT = t; $("scrub").value = t; load(t, paused); }
function changed() {
  drawMarks();
  clearTimeout(reloadTimer);
  reloadTimer = setTimeout(() => load(Math.max(0, curT - 0.5), !playing), 450);
}
addEventListener("message", (e) => {
  const m = e.data || {};
  if (m.type === "morph-time" && m.t >= 0) {
    curT = m.t;
    $("time").textContent = `${m.t.toFixed(2)} s${m.ff ? " (jumping)" : ""}`;
    if (document.activeElement !== $("scrub")) $("scrub").value = m.t;
    if (!m.ff && /^Loading/.test($("status").textContent)) status("");
  }
  if (m.type === "morph-dest") status(`End of sequence: the page would now open ${m.dest}`);
});
$("play").onclick = () => {
  playing = !playing;
  $("preview").contentWindow.postMessage({ type: playing ? "morph-play" : "morph-pause" }, "*");
  $("play").textContent = playing ? "Pause" : "Play";
};
$("replay").onclick = () => { curT = 0; load(0, false); };
$("scrub").addEventListener("change", () => seek(+$("scrub").value, true));
$("mode").onchange = () => { drawMarks(); load(0, false); };
$("reset").onclick = () => {
  if (!confirm("Reset every value to the published morph-config.json?")) return;
  cfg = structuredClone(fileCfg);
  localStorage.removeItem(EDIT_KEY);
  buildGui();
  changed();
};
const json = () => JSON.stringify(cfg, null, 2) + "\n";
$("copy").onclick = async () => {
  try { await navigator.clipboard.writeText(json()); status("Settings copied. Paste them into morph-config.json and commit."); }
  catch (e) { status("Copy was blocked by the browser; use Download instead."); }
};
$("download").onclick = () => {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([json()], { type: "application/json" }));
  a.download = "morph-config.json";
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  status("Downloaded morph-config.json. Replace the file in the repo and commit it to publish.");
};
$("apply").onclick = () => { localStorage.setItem(LIVE_KEY, JSON.stringify(cfg)); status("This browser now plays these settings on the normal page. Other people still see the published file."); };
$("clear").onclick = () => { localStorage.removeItem(LIVE_KEY); status("Saved browser settings cleared."); };

{ const mv = new URLSearchParams(location.search).get("v"); if (mv && [...$("mode").options].some((o) => o.value === mv)) $("mode").value = mv; }

/* ---------- controls ---------- */
const LABELS = {
  dest: "DEST link (opens at the end)", scan: "Scan", fill: "QR fills the screen", lift: "Lift wave", flight: "Flight",
  assembly: "Assembly", morph_end_s: "morph ends at (s)", resolve: "Blocks to real unit", camera: "Camera", lights: "Light cycle", boom: "Boom", colours: "Colours", minions: "Minions (?v=minions)", minions2: "Minions everywhere (?v=minions2)", domino: "Domino guard of honour (?v=domino)", domino2: "Domino crowd everywhere (?v=domino2; anything not set comes from Domino)", drone: "Drone view to the road (?v=drone)", road: "Road scene (?v=road)",
};
const RANGES = [
  [/^lines_per_side$/, 1, 4, 1], [/^(row|line)_gap$/, 0.08, 0.8, 0.005], [/^max_rows$/, 4, 60, 1], [/^dolly_start$/, 1, 3, 0.01], [/^aisle_width$/, 0.3, 1.5, 0.01], [/^(camera|look)_height$/, 0.1, 1.2, 0.01], [/^(first_row|salute_lead)$/, 0, 1.5, 0.01], [/^overshoot$/, 0, 0.4, 0.01], [/^count$/, 20, 400, 1], [/^size_mix$/, 0, 0.9, 0.01], [/^yaw_jitter$/, 0, 2, 0.01], [/^(reach_x|reach_back)$/, 1, 20, 0.1], [/^ripple_spread$/, 0, 2, 0.01], [/^centre_[xz]$/, -4, 4, 0.05], [/^swoop_side$/, -10, 10, 0.1], [/^swoop_back$/, 0, 1.5, 0.01], [/^bank_deg$/, 0, 25, 0.5], [/^random$/, 0, 1, 0.01],
  [/^count$/, 30, 300, 1], [/^ring$/, 0.2, 1.5, 0.01], [/^hero_clear$/, 0, 0.3, 0.005], [/^depth_grow$/, 0, 1.5, 0.01], [/^max_depth$/, 10, 120, 1], [/^reach_cells$/, 0, 120, 1], [/^rows$/, 1, 6, 1], [/_gap$/, 0.2, 1.2, 0.01], [/^bob$/, 0, 0.4, 0.01], [/_hz$/, 0.5, 5, 0.05], [/arm_length$/, 0.3, 1.4, 0.01],
  [/passes$/, 1, 6, 1], [/^cars$/, 0, 5, 1], [/^workers$/, 0, 3, 1], [/^car_speed$/, 2, 20, 0.5], [/^car_accel$/, 0.5, 6, 0.1], [/^fog_(near|far)$/, 5, 300, 1], [/^build_radius$/, 40, 400, 5], [/count$/, 10, 400, 1], [/voxel_count$/, 300, 1500, 10], [/_deg$/, 0, 60, 0.5], [/pitch_deg$/, 0, 6, 0.1],
  [/fov/, 20, 75, 0.5], [/unit_height/, 0.3, 0.8, 0.005], [/lens_y$/, 0.25, 0.6, 0.005], [/left_margin$/, 0, 0.2, 0.002],
  [/tilt_curve$/, 0.3, 2, 0.01], [/height_cells$/, 0, 4, 0.05], [/speed_cells$/, 4, 60, 1], [/spacing_cells$/, 3, 20, 0.5],
  [/stagger|jitter|arc|tilt$|band|push_in|sweep_ring|lens_flash|recolour|size$/, 0, 2, 0.01], [/spin$/, 0, 3, 0.05],
  [/_s$/, 0, 8, 0.05],
];
function range(key, v) {
  for (const [re, lo, hi, st] of RANGES) if (re.test(key)) return [lo, Math.max(hi, v), st];
  return [0, Math.max(1, v * 3), 0.01];
}
let gui = null;
function addAll(folder, obj, path) {
  for (const [k, v] of Object.entries(obj)) {
    if (k.startsWith("_")) continue;
    if (v && typeof v === "object") { addAll(folder.addFolder(LABELS[k] || k), v, path.concat(k)); continue; }
    const name = (LABELS[k] || k).replace(/_/g, " ");
    let c;
    if (typeof v === "string" && /^#[0-9a-f]{6}$/i.test(v)) c = folder.addColor(obj, k);
    else if (k === "style") c = folder.add(obj, k, ["shimmer", "shrink"]);
    else if (typeof v === "number") { const [lo, hi, st] = range(k, v); c = folder.add(obj, k, lo, hi, st); }
    else c = folder.add(obj, k);
    c.name(name).onFinishChange(changed);
  }
}
function buildGui() {
  if (gui) gui.destroy();
  gui = new GUI({ container: $("right"), title: "PORTABOOM settings" });
  addAll(gui, cfg, []);
  gui.folders.forEach((f, i) => { if (i > 1) f.close(); });
}

/* ---------- fit the phone frame ---------- */
function fit() {
  const box = $("phone").getBoundingClientRect();
  const k = Math.min(box.width / 390, box.height / 844, 1);
  $("frameWrap").style.transform = `scale(${k})`;
  $("frameWrap").style.margin = `${(844 * k - 844) / 2}px ${(390 * k - 390) / 2}px`;
}
addEventListener("resize", fit);

buildGui();
drawMarks();
fit();
load(0, false);
</script>
</body>
</html>
