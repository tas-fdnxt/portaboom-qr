<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">

<title>PORTABOOM QR</title>
<meta property="og:title" content="PORTABOOM QR">
<meta property="og:description" content="Scan the PORTABOOM QR and watch its modules build the PB4000.">
<meta property="og:image" content="https://tas-fdnxt.github.io/portaboom-qr/portaboom-morph2-qr.png">

<style>
:root{
  --soft:#101317; --paper:#FFFFFF; --ink:#F4F6F9; --ink-soft:#C5CAD3;
  --line:rgba(122,152,214,.26); --navy:#1B2A4A; --navy-deep:#0d1528;
  --orange:#EE7202; --orange-h:#FF8A1F;
  --sans:"Inter",-apple-system,system-ui,sans-serif;
  --serif:"Fraunces",Georgia,serif; --mono:"JetBrains Mono",Menlo,monospace;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--soft);overflow:hidden;font-family:var(--sans)}
canvas#stage{position:fixed;inset:0;width:100%;height:100dvh;display:block;touch-action:none;background:#0d0d12}
.vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(120% 90% at 50% 45%,transparent 60%,rgba(5,7,10,.45) 100%);z-index:2}
#hud{position:fixed;inset:0;z-index:3;pointer-events:none;padding:calc(var(--sat)+12px) calc(var(--sar)+12px) calc(var(--sab)+12px) calc(var(--sal)+12px);display:flex;flex-direction:column;justify-content:space-between}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.badge{pointer-events:auto;display:inline-flex;align-items:center;gap:8px;background:var(--orange);color:#fff;border-radius:999px;padding:8px 12px;font:800 11px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase}
.brand{pointer-events:auto;display:inline-flex;align-items:center;gap:8px;background:rgba(13,21,40,.92);color:#fff;border:1px solid var(--line);border-radius:999px;padding:6px 12px 6px 6px;text-decoration:none;max-width:min(58vw,260px);backdrop-filter:blur(10px)}
.brand img{height:26px;background:#fff;border-radius:999px;padding:3px 7px}
.brand span{font:700 12px/1 var(--sans);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dock{pointer-events:auto;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;width:min(100%,420px);margin:0 auto}
.dock[hidden]{display:none !important}
.btn{appearance:none;border:0;border-radius:999px;padding:12px 16px;font:700 13px/1 var(--sans);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 8px 28px rgba(0,0,0,.36);min-height:44px}
.btn.primary{background:var(--orange);color:#fff}
.btn.ghost{background:rgba(238,242,250,.92);color:var(--navy);border:1px solid var(--line)}
.btn.on{background:var(--orange);color:#fff}
.btn.off{background:rgba(13,21,40,.88);color:#eef2fa;border:1px solid var(--line)}
#status{display:none;position:fixed;left:50%;transform:translateX(-50%);top:calc(var(--sat)+56px);z-index:4;pointer-events:none;font:700 11px/1.2 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:#ffb84d;background:rgba(13,21,40,.88);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:999px;padding:8px 12px;max-width:90vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
body.scan-open #status{display:block}
#aspect{display:none !important;position:fixed;right:12px;top:calc(var(--sat)+56px);z-index:4;pointer-events:none;font:800 11px/1 var(--sans);letter-spacing:.12em;border-radius:999px;padding:8px 10px;color:#081018;background:#18ff5a}
#aspect[data-aspect="amber"]{background:#ffb000}
#aspect[data-aspect="red"]{background:#ff1d12;color:#fff}
#aspect[data-aspect="green"]{background:#18ff5a}
#aspect[data-aspect="off"]{background:#5d6f93;color:#eef2fa}
#stage:not([data-iqr-ready]){background:
  radial-gradient(ellipse at 50% 38%,#1B2A4A 0%,#101317 52%,#0B0D10 100%)}
#fail{display:none;position:fixed;inset:0;place-items:center;background:var(--soft);color:#fff;padding:28px;text-align:center;z-index:20}
#fail.show{display:grid}
body.showtime #liveDock,
body.showtime #moreDock,
body.showtime #hud,
body.showtime #status,
body.showtime .vig{display:none !important}
body.showtime{background:#f4efe6}
body.showtime canvas#stage:not([data-iqr-ready]){background:#f4efe6}
#motionHint{display:none;position:fixed;left:50%;bottom:calc(var(--sab)+18px);transform:translateX(-50%);z-index:5;pointer-events:none;font:800 11px/1 var(--sans);letter-spacing:.12em;text-transform:uppercase;color:#9A3F00;background:rgba(244,239,230,.92);border:1px solid rgba(238,114,2,.35);border-radius:999px;padding:8px 12px;white-space:nowrap}
body.motion1 #motionHint{display:block}
body.motion1.scan-open #motionHint{display:none}
body.motion2 #motionHint{display:block}
body.motion2.scan-open #motionHint{display:none}
body.motion2{background:#0d0d12}
body.motion2 canvas#stage:not([data-iqr-ready]){background:#0d0d12}
body.motion3 #motionHint{display:block}
body.motion3{background:#f4efe6}
body.motion3 canvas#stage:not([data-iqr-ready]){background:#f4efe6}
body.morph1{background:#f4efe6}
body.morph1 canvas#stage{background:#f4efe6}
/* morph1: the still itself is the instant first paint, sized exactly like the WebGL frame 0:
   the QR square is 90% of the width, capped so the scan button fits below it. --m1q is the square side. */
body.morph1{--m1q:min(90vw, calc(100vh - 200px));--m1q:min(90vw, calc(100dvh - 200px))}
#morph1Still,#morph1Scan,#morph1ScanFx{display:none}
body.morph1 #morph1Still{display:block;position:fixed;left:50%;top:50vh;top:50dvh;width:var(--m1q);height:var(--m1q);transform:translate(-50%,-50%);z-index:1;pointer-events:none}
body.morph1.morph1-live #morph1Still{display:none}
/* morph1: one surface. Nothing else may paint over the canvas (the still is removed from the DOM on hand-over). */
body.morph1 .vig,body.morph1 #hud,body.morph1 #status,body.morph1 #aspect,body.morph1 #motionHint{display:none !important}
#morph1Video{display:none}
body.morph1.morph1-fallback canvas#stage{visibility:hidden}
body.morph1.morph1-playing #morph1Video{display:block;position:fixed;left:0;top:0;width:100%;height:100vh;height:100dvh;object-fit:cover;background:#f4efe6;z-index:2}
body.morph1 #morph1Scan{display:inline-flex;align-items:center;justify-content:center;gap:10px;position:fixed;left:50%;top:calc(50vh + var(--m1q) / 2 + 22px);top:calc(50dvh + var(--m1q) / 2 + 22px);transform:translateX(-50%);z-index:4;min-width:220px;min-height:60px;padding:0 34px;border:0;border-radius:999px;background:#EE7202;color:#fff;font:700 19px/1 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;letter-spacing:.02em;box-shadow:0 6px 18px rgba(238,114,2,.35),0 2px 4px rgba(27,42,74,.18);cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
body.morph1 #morph1Scan svg{width:24px;height:24px;flex:none}
body.morph1 #morph1Scan:focus-visible{outline:3px solid #1B2A4A;outline-offset:3px}
body.morph1 #morph1Scan.pressed{background:#C95F00;box-shadow:0 2px 8px rgba(238,114,2,.3);transform:translateX(-50%) scale(.96)}
body.morph1 #morph1Scan[hidden]{display:none}
body.morph2.morph-auto #morph1Scan{display:none}
body.morph1 #morph1ScanFx{position:fixed;left:50%;top:50vh;top:50dvh;width:var(--m1q);height:var(--m1q);transform:translate(-50%,-50%);z-index:3;pointer-events:none;overflow:hidden;opacity:0}
body.morph1.morph1-scanning #morph1ScanFx{display:block}
#morph1ScanFx .br{position:absolute;width:15%;height:15%;border:0 solid #EE7202}
#morph1ScanFx .tl{left:2%;top:2%;border-left-width:6px;border-top-width:6px;border-top-left-radius:10px}
#morph1ScanFx .tr{right:2%;top:2%;border-right-width:6px;border-top-width:6px;border-top-right-radius:10px}
#morph1ScanFx .bl{left:2%;bottom:2%;border-left-width:6px;border-bottom-width:6px;border-bottom-left-radius:10px}
#morph1ScanFx .brr{right:2%;bottom:2%;border-right-width:6px;border-bottom-width:6px;border-bottom-right-radius:10px}
#morph1ScanFx .line{position:absolute;left:4%;right:4%;top:0;height:4px;border-radius:2px;background:#EE7202;box-shadow:0 0 14px 4px rgba(238,114,2,.55)}
#morph1ScanFx .glow{position:absolute;left:4%;right:4%;top:0;height:18%;background:linear-gradient(to bottom,rgba(238,114,2,0),rgba(238,114,2,.16));transform:translateY(-100%)}
@media (max-width:480px){
  .dock{gap:7px}
  .btn{padding:12px 14px;font-size:12px;flex:1 1 calc(50% - 8px)}
}
</style>
</head>
<body class="live-scan">
<img id="morph1Still" alt="" aria-hidden="true">
<script>
(function () {
  // Pick the still for the mode before first paint (morph2 draws the unit in QR modules).
  const DEFAULT_V = "morph2";
  const v = new URLSearchParams(location.search).get("v") || DEFAULT_V;
  const img = document.getElementById("morph1Still");
  if (img) img.src = v === "morph2" || v === "morph3" || v === "road" ? "./portaboom-morph2-qr.png?b=b034e56e" : "./portaboom-morph-qr.png?b=b034e56e";
})();
</script>
<button id="morph1Scan" type="button" aria-label="Tap to scan the PORTABOOM QR code"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M3 8V5a2 2 0 0 1 2-2h3M16 3h3a2 2 0 0 1 2 2v3M21 16v3a2 2 0 0 1-2 2h-3M8 21H5a2 2 0 0 1-2-2v-3M6 12h12"/></svg><span>Tap to scan</span></button>
<div id="morph1ScanFx" aria-hidden="true"><i class="br tl"></i><i class="br tr"></i><i class="br bl"></i><i class="br brr"></i><i class="glow"></i><i class="line"></i></div>
<video id="morph1Video" muted playsinline webkit-playsinline preload="none" aria-label="PORTABOOM PB4000 stands up out of the QR"></video>
<canvas id="stage" aria-label="PORTABOOM PB4000 QR"></canvas>
<div class="vig" aria-hidden="true"></div>
<div id="status">Living QR · tap to scan the field</div>
<div id="aspect" data-aspect="green">GREEN</div>
<div id="hud">
  <div class="row">
    <div class="badge" id="modeBadge">Living QR</div>
    <a class="brand" href="https://www.trafficaccess.com.au/portaboom-product/portaboom-pb4000-series/" target="_blank" rel="noopener">
      <img src="./portaboom_logo.png?b=b034e56e" alt="PORTABOOM"><span>PB4000</span>
    </a>
  </div>
  <div class="dock" id="liveDock">
    <button class="btn on" id="lifeBtn" type="button" aria-pressed="true">Life ON</button>
    <button class="btn primary" id="scanBtn" type="button">Tap to scan</button>
  </div>
  <div class="dock" id="moreDock" hidden>
    <button class="btn ghost" id="printBtn" type="button">Print PNG</button>
  </div>
</div>
<div id="fail"><div><h2>WebGL unavailable</h2><p>Open on a phone or laptop with WebGL.</p></div></div>
<script type="importmap">
{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
}}
</script>
<div id="motionHint">Tap to flatten</div>
<!-- Mode loader. No v= opens morph2: the module QR, scan, modules fly into the 3D unit, boom cycle, then DEST. -->
<script>
(function () {
  const q = new URLSearchParams(location.search);
  // Mode when the URL has no v=.
  const DEFAULT_V = "morph2";
  // morph3: the same QR and scan as morph2, a wider hero shot with a camera glide (app3.js).
  const morph3 = q.get("v") === "morph3";
  // road: morph3 with the worksite road scene built around the unit (app-road.js).
  const road = q.get("v") === "road";
  const morph2 = morph3 || road || q.get("v") === "morph2" || (!q.get("v") && DEFAULT_V === "morph2");
  const morph1 = morph2 || q.get("v") === "morph1" || (!q.get("v") && DEFAULT_V === "morph1");
  const motion1 = q.get("v") === "motion1";
  const motion2 = q.get("v") === "motion2";
  const motion3 = q.get("v") === "motion3";
  const showtime = q.get("showtime") === "1" || q.get("v") === "preview5" || motion1 || motion2 || motion3 || morph1;
  if (showtime) {
    document.body.classList.add("showtime");
    const doorBg = motion2 ? "#0d0d12" : "#f4efe6";
    document.documentElement.style.background = doorBg;
    document.querySelector('meta[name="theme-color"]')?.setAttribute("content", doorBg);
  }
  if (motion1) document.body.classList.add("motion1");
  if (motion2) {
    document.body.classList.add("motion2");
    const hint = document.getElementById("motionHint");
    if (hint) hint.textContent = "Auto showtime";
  }
  if (motion3) {
    document.body.classList.add("motion3");
    const hint = document.getElementById("motionHint");
    if (hint) hint.textContent = "Living field";
  }
  if (morph1) {
    document.body.classList.add("morph1");
    if (morph2) document.body.classList.add("morph2");
    // morph2 / morph3 start by themselves; the "Tap to scan" button is only for ?test=1.
    const autoStart = morph2 && q.get("test") !== "1";
    if (autoStart) {
      document.body.classList.add("morph-auto");
      document.getElementById("morph1Scan")?.setAttribute("hidden", "");
    }
    // A press before the 3D scene is up is remembered; app.js starts the scan when ready.
    const btn = document.getElementById("morph1Scan");
    if (btn) btn.addEventListener("click", () => { window.__morph1ScanQueued = true; btn.classList.add("pressed"); });
    // Fallback: no WebGL, lost context, no GLB or app.js never started. Play the
    // recorded morph (same framing: QR square centred, button below) in place,
    // then leave to DEST. The reason is logged and kept in window.__morph1FallbackReason.
    let fallen = false;
    let played = false;
    const leave = () => {
      import("./dest-config.mjs?b=b034e56e").then((m) => {
        const dest = m.resolveLeaveDest(q.get("dest"));
        if (typeof window.__iqrOnLeaveToDest === "function") window.__iqrOnLeaveToDest({ dest, reason: "fallback-video" });
        else location.assign(dest);
      }).catch(() => location.assign("https://www.trafficaccess.com.au/portaboom-product/portaboom-pb4000-series/"));
    };
    window.__morph1Play = () => {
      if (played) return;
      played = true;
      const v = document.getElementById("morph1Video");
      document.getElementById("morph1Still")?.remove();
      if (btn) btn.style.display = "none";
      document.body.classList.add("morph1-playing");
      v.addEventListener("ended", leave, { once: true });
      v.addEventListener("error", () => { console.warn("morph1 fallback video error"); leave(); }, { once: true });
      const start = () => { try { v.currentTime = 1.5; } catch (e) { /* seek later */ } v.play().catch((e) => console.warn("morph1 fallback video play:", e && e.message)); };
      if (v.readyState >= 1) start();
      else {
        v.addEventListener("loadedmetadata", start, { once: true });
        if (v.networkState === 0) v.load();
      }
    };
    window.__morph1Fallback = (reason) => {
      if (fallen) return;
      fallen = true;
      window.__morph1FallbackReason = String(reason);
      console.warn("morph1 fallback:", reason);
      document.body.classList.add("morph1-fallback");
      const v = document.getElementById("morph1Video");
      v.src = road ? "./road.mp4?b=8f51c13f" : morph3 ? "./morph3.mp4?b=c48638ba" : morph2 ? "./morph2.mp4?b=b034e56e" : "./morph1.mp4?b=b034e56e";
      v.preload = "auto";
      if (btn) btn.addEventListener("click", () => window.__morph1Play());
      document.getElementById("morph1Still")?.addEventListener("click", () => window.__morph1Play());
      if (window.__morph1ScanQueued || autoStart || q.get("autoplay") === "1") window.__morph1Play();
    };
    // app.js must start; a module that fails to load or link never sets __iqrBooted.
    setTimeout(() => { if (!window.__iqrBooted) window.__morph1Fallback("app-not-started"); }, 15000);
    // Back from DEST via bfcache: start clean instead of resuming a finished run.
    addEventListener("pageshow", (e) => { if (e.persisted) location.reload(); });
  }
  const src = road ? "./app-road.js?b=8c24aeb6&v=road" : morph3 ? "./app3.js?b=609021df&v=morph3" : morph2 ? "./app.js?b=0dc75376&v=morph2" : morph1 ? "./app.js?b=0dc75376&v=morph1" : motion3 ? "./app.js?b=0dc75376&v=motion3" : motion2 ? "./app.js?b=0dc75376&v=motion2" : motion1 ? "./app.js?b=0dc75376&v=motion1" : "./app.js?b=0dc75376&v=living10";
  const s = document.createElement("script");
  s.type = "module";
  s.src = src;
  if (morph1) s.onerror = () => window.__morph1Fallback && window.__morph1Fallback("app-load-error");
  document.body.appendChild(s);
})();
</script>
</body>
